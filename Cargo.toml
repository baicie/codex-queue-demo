[package]
name = "codex-queue-demo"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Cross-platform scheduled queue worker for Codex CLI"
license = "MIT"

[workspace]
members = ["src-tauri"]
resolver = "2"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
