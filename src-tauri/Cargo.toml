[package]
name = "codex-queue-desktop"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
description = "Tauri desktop interface for Codex Queue"
license = "MIT"

[lib]
name = "codex_queue_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
codex-queue-demo = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.20"
